<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern VR Viscometer Lab</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center; 
            color: #333; pointer-events: none; font-weight: bold; text-shadow: 1px 1px 0px white;
            z-index: 10;
        }
        #cursor {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: rgba(0, 0, 0, 0.5); border: 2px solid white; border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info">
        <h1>Modern VR Physics Lab</h1>
        <p>PC: Click buttons | VR: Point & Trigger</p>
    </div>
    
    <div id="cursor"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================
        // 0. TEXTURE GENERATORS (Assets)
        // ==========================
        
        // 1. Tile Floor Texture
        function createTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#e0e0e0'; ctx.fillRect(0,0,512,512); // Base
            ctx.strokeStyle = '#aaaaaa'; ctx.lineWidth = 4;
            // Draw grid
            for(let i=0; i<=512; i+=64) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,512); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(512,i); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 8);
            return tex;
        }

        // 2. Outside View (Sky + Grass)
        function createOutsideTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            // Sky
            const grd = ctx.createLinearGradient(0, 0, 0, 300);
            grd.addColorStop(0, "#00B4DB"); grd.addColorStop(1, "#83EAF1");
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 512, 350);
            // Clouds
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            for(let i=0; i<10; i++) {
                ctx.beginPath(); 
                ctx.arc(Math.random()*512, Math.random()*200, 30 + Math.random()*30, 0, Math.PI*2); 
                ctx.fill();
            }
            // Grass
            ctx.fillStyle = "#4caf50"; ctx.fillRect(0, 350, 512, 162);
            return new THREE.CanvasTexture(canvas);
        }

        // 3. Abstract Art
        function createArtTexture(hue) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = `hsl(${hue}, 50%, 90%)`; ctx.fillRect(0,0,256,256);
            for(let i=0; i<20; i++){
                ctx.fillStyle = `hsl(${hue + Math.random()*50}, 70%, 50%)`;
                ctx.beginPath();
                ctx.arc(Math.random()*256, Math.random()*256, Math.random()*40, 0, Math.PI*2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        }

        // ==========================
        // 1. SCENE & LIGHTING
        // ==========================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue backup

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 2.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        // -- Bright Lighting --
        // Ambient (General daylight)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffee, 0.8);
        scene.add(hemiLight);

        // Sun coming through window
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 2);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // ==========================
        // 2. ROOM ARCHITECTURE
        // ==========================
        const roomGroup = new THREE.Group();
        scene.add(roomGroup);

        // Floor (Tiles)
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: createTileTexture(),
            roughness: 0.2, // Shiny tiles
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        roomGroup.add(floor);

        // Walls (Cream color)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 1 }); // Beige
        
        // Back Wall
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 0.1), wallMat);
        backWall.position.set(0, 2, -3);
        backWall.receiveShadow = true;
        roomGroup.add(backWall);

        // Side Walls
        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 10), wallMat);
        leftWall.position.set(-5, 2, 0);
        leftWall.receiveShadow = true;
        roomGroup.add(leftWall);

        const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4, 10), wallMat);
        rightWall.position.set(5, 2, 0);
        rightWall.receiveShadow = true;
        roomGroup.add(rightWall);

        // Ceiling
        const ceiling = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 10), new THREE.MeshBasicMaterial({color: 0xffffff}));
        ceiling.position.y = 4;
        roomGroup.add(ceiling);

        // -- Windows & Outside --
        // Create a large Cylinder surrounding the room for the "World View"
        const worldGeo = new THREE.CylinderGeometry(20, 20, 15, 32);
        const worldMat = new THREE.MeshBasicMaterial({ 
            map: createOutsideTexture(), 
            side: THREE.BackSide 
        });
        const world = new THREE.Mesh(worldGeo, worldMat);
        scene.add(world);

        // Add Window Frames to Walls
        function createWindow(x, z, rotY) {
            const frameGroup = new THREE.Group();
            frameGroup.position.set(x, 2, z);
            frameGroup.rotation.y = rotY;

            // Frame
            const fGeo = new THREE.BoxGeometry(0.2, 1.5, 2.5); // Thick frame
            const fMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const frame = new THREE.Mesh(fGeo, fMat);
            frameGroup.add(frame);

            // Glass/Hole (Visual only - using emissive to look bright)
            const gGeo = new THREE.PlaneGeometry(2.3, 1.3);
            const gMat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, opacity: 0.3, transparent: true });
            const glass = new THREE.Mesh(gGeo, gMat);
            glass.position.x = 0.11;
            glass.rotation.y = Math.PI/2;
            frameGroup.add(glass);

            return frameGroup;
        }

        roomGroup.add(createWindow(4.95, 0, 0)); // Right Window
        roomGroup.add(createWindow(-4.95, 0, 0)); // Left Window

        // ==========================
        // 3. DECOR (Paintings & Plants)
        // ==========================
        
        // Paintings
        function createPainting(x, y, z, hue) {
            const grp = new THREE.Group();
            grp.position.set(x, y, z);
            
            // Frame
            const frame = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.05), new THREE.MeshStandardMaterial({color: 0x333333}));
            grp.add(frame);
            
            // Canvas
            const canvas = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.MeshBasicMaterial({ map: createArtTexture(hue) })
            );
            canvas.position.z = 0.03;
            grp.add(canvas);
            
            return grp;
        }
        roomGroup.add(createPainting(-2, 2, -2.9, 200));
        roomGroup.add(createPainting(2, 2, -2.9, 0));

        // Plant
        function createPlant(x, z) {
            const grp = new THREE.Group();
            grp.position.set(x, 0, z);

            // Pot
            const pot = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.2, 0.5, 16),
                new THREE.MeshStandardMaterial({ color: 0x8B4513 })
            );
            pot.position.y = 0.25;
            pot.castShadow = true;
            grp.add(pot);

            // Leaves (Simple spheres)
            const leafMat = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const positions = [[0, 0.6, 0], [0.2, 0.5, 0.2], [-0.2, 0.55, -0.1], [0.1, 0.5, -0.2]];
            positions.forEach(pos => {
                const leaf = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25), leafMat);
                leaf.position.set(pos[0], pos[1], pos[2]);
                leaf.castShadow = true;
                grp.add(leaf);
            });
            return grp;
        }
        roomGroup.add(createPlant(-3.5, -3.5)); // Corner plant
        roomGroup.add(createPlant(3.5, -3.5));

        // ==========================
        // 4. EXPERIMENT SETUP (Table & Viscometer)
        // ==========================
        const tableGroup = new THREE.Group();
        tableGroup.position.set(0, 0, -1);
        scene.add(tableGroup);

        const tableTop = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.05, 0.8),
            new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.6 }) // Dark Wood
        );
        tableTop.position.y = 0.8;
        tableTop.castShadow = true;
        tableTop.receiveShadow = true;
        tableGroup.add(tableTop);

        const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.8);
        const legMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        [[-0.7, -0.3], [0.7, -0.3], [-0.7, 0.3], [0.7, 0.3]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(pos[0], 0.4, pos[1]);
            leg.castShadow = true;
            tableGroup.add(leg);
        });

        // Viscometer
        const viscGroup = new THREE.Group();
        viscGroup.position.set(0, 0.825, 0);
        tableGroup.add(viscGroup);

        // Base
        const vBase = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), new THREE.MeshStandardMaterial({color:0x111}));
        vBase.position.y = 0.025;
        vBase.castShadow = true;
        viscGroup.add(vBase);

        const innerCyl = new THREE.Mesh(
            new THREE.CylinderGeometry(0.12, 0.12, 0.4, 32),
            new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.6, roughness: 0.3 })
        );
        innerCyl.position.y = 0.25;
        innerCyl.castShadow = true;
        viscGroup.add(innerCyl);

        const outerCyl = new THREE.Mesh(
            new THREE.CylinderGeometry(0.20, 0.20, 0.4, 32),
            new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, transmission: 0.95, opacity: 0.4, transparent: true, roughness: 0, thickness: 0.1
            })
        );
        outerCyl.position.y = 0.25;
        viscGroup.add(outerCyl);

        // ==========================
        // 5. PANELS & LOGIC
        // ==========================
        const params = { viscosity: 1.0, rpm: 30, innerRadius: 0.12, outerRadius: 0.20, length: 0.4 };
        const buttons = [];

        function createButton(x, y, label, color, action) {
            const btnGroup = new THREE.Group();
            btnGroup.position.set(x, y, 0.02);
            const geo = new THREE.BoxGeometry(0.15, 0.08, 0.02);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = { action: action };
            btnGroup.add(mesh);
            buttons.push(mesh);
            
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color; ctx.fillRect(0,0,128,64);
            ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(label, 64, 32);
            const tMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.15,0.08), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(canvas), transparent:true}));
            tMesh.position.z = 0.011;
            btnGroup.add(tMesh);
            return btnGroup;
        }

        // Left Panel (Input)
        const leftPanel = new THREE.Group();
        leftPanel.position.set(-1.1, 1.3, -0.5);
        leftPanel.rotation.y = 0.5;
        scene.add(leftPanel);
        
        const lpBg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.05), new THREE.MeshStandardMaterial({color:0x222}));
        leftPanel.add(lpBg);
        
        // Input Screen
        const iCanvas = document.createElement('canvas'); iCanvas.width = 256; iCanvas.height = 128;
        const iCtx = iCanvas.getContext('2d');
        const iTex = new THREE.CanvasTexture(iCanvas);
        const iScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.2), new THREE.MeshBasicMaterial({map:iTex}));
        iScreen.position.set(0, 0.1, 0.03);
        leftPanel.add(iScreen);

        leftPanel.add(createButton(0.15, -0.1, 'RPM +', 0x2e7d32, ()=>params.rpm+=10));
        leftPanel.add(createButton(-0.15, -0.1, 'RPM -', 0xc62828, ()=>params.rpm=Math.max(0,params.rpm-10)));
        leftPanel.add(createButton(0.15, -0.2, 'Visc +', 0x1565c0, ()=>params.viscosity+=0.5));
        leftPanel.add(createButton(-0.15, -0.2, 'Visc -', 0xf9a825, ()=>params.viscosity=Math.max(0.1,params.viscosity-0.5)));

        // Right Panel (Output)
        const rightPanel = new THREE.Group();
        rightPanel.position.set(1.1, 1.3, -0.5);
        rightPanel.rotation.y = -0.5;
        scene.add(rightPanel);

        const rpBg = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.05), new THREE.MeshStandardMaterial({color:0x111}));
        rightPanel.add(rpBg);

        const oCanvas = document.createElement('canvas'); oCanvas.width = 512; oCanvas.height = 256;
        const oCtx = oCanvas.getContext('2d');
        const oTex = new THREE.CanvasTexture(oCanvas);
        const oScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.3), new THREE.MeshBasicMaterial({map:oTex}));
        oScreen.position.z = 0.03;
        rightPanel.add(oScreen);

        // ==========================
        // 6. LOGIC & INTERACTION
        // ==========================
        function updateLogic() {
            // Update Input Screen
            iCtx.fillStyle = '#000'; iCtx.fillRect(0,0,256,128);
            iCtx.fillStyle = '#fff'; iCtx.font = '24px Arial';
            iCtx.fillText(`RPM: ${params.rpm}`, 20, 50);
            iCtx.fillText(`Viscosity: ${params.viscosity.toFixed(1)}`, 20, 90);
            iTex.needsUpdate = true;

            // Physics
            const omega = (params.rpm * 2 * Math.PI) / 60;
            const term = (Math.pow(params.innerRadius,2)*Math.pow(params.outerRadius,2)) / (Math.pow(params.outerRadius,2)-Math.pow(params.innerRadius,2));
            const torque = 4 * Math.PI * params.viscosity * params.length * term * omega;

            // Update Output Screen
            oCtx.fillStyle = '#111'; oCtx.fillRect(0,0,512,256);
            oCtx.strokeStyle = '#0ff'; oCtx.lineWidth=5; oCtx.strokeRect(5,5,502,251);
            oCtx.font = 'bold 50px Arial'; oCtx.fillStyle = '#fff'; oCtx.fillText("TORQUE", 150, 80);
            oCtx.font = 'bold 80px Courier New'; oCtx.fillStyle = '#0f0'; oCtx.fillText(torque.toFixed(3) + " Nm", 40, 180);
            oTex.needsUpdate = true;

            return omega;
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        window.addEventListener('click', () => {
            mouse.set(0,0); raycaster.setFromCamera(mouse, camera);
            checkIntersects();
        });

        // VR Controllers
        const controller1 = renderer.xr.getController(0);
        controller1.addEventListener('selectstart', onSelect);
        scene.add(controller1);
        const controller2 = renderer.xr.getController(1);
        controller2.addEventListener('selectstart', onSelect);
        scene.add(controller2);

        const cmf = new XRControllerModelFactory();
        const cg1 = renderer.xr.getControllerGrip(0); cg1.add(cmf.createControllerModel(cg1)); scene.add(cg1);
        const cg2 = renderer.xr.getControllerGrip(1); cg2.add(cmf.createControllerModel(cg2)); scene.add(cg2);

        // Laser
        const laser = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-5)]));
        laser.material.color.set(0xff0000);
        controller1.add(laser.clone()); controller2.add(laser.clone());

        function onSelect(e) {
            const tempMat = new THREE.Matrix4();
            tempMat.identity().extractRotation(e.target.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(e.target.matrixWorld);
            raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMat);
            checkIntersects();
        }

        function checkIntersects() {
            const intersects = raycaster.intersectObjects(buttons);
            if(intersects.length > 0) {
                const btn = intersects[0].object;
                btn.material.emissive.setHex(0x555555);
                setTimeout(()=>btn.material.emissive.setHex(0x000000), 100);
                btn.userData.action();
            }
        }

        // Loop
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 1, 0);
        controls.update();

        renderer.setAnimationLoop(() => {
            const w = updateLogic();
            innerCyl.rotation.y -= w * 0.01;
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
